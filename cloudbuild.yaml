steps:
  # Step 0: Install dependencies
  - name: 'python:3.13'
    id: 'Install dependencies'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt -t .; fi

  # Step 1: Deploy all handlers
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy handlers'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _REGION=${_REGION}
        _RUNTIME=${_RUNTIME}
        PROJECT_ID=${PROJECT_ID}

        # Deploy auth_handler
        echo "[INFO] Deploying auth_handler"
        echo "from handlers.auth_handler import auth_handler" > main.py
        gcloud functions deploy auth_handler \
          --gen2 \
          --runtime=${_RUNTIME} \
          --region=${_REGION} \
          --source=. \
          --entry-point=auth_handler \
          --trigger-http \
          --allow-unauthenticated \
          --memory=256MB \
          --timeout=60s

        # Deploy ride_handler
        echo "[INFO] Deploying ride_handler"
        echo "from handlers.ride_handler import ride_handler" > main.py
        gcloud functions deploy ride_handler \
          --gen2 \
          --runtime=${_RUNTIME} \
          --region=${_REGION} \
          --source=. \
          --entry-point=ride_handler \
          --trigger-http \
          --allow-unauthenticated \
          --memory=256MB \
          --timeout=60s

        # Deploy matchmaker_handler
        echo "[INFO] Deploying matchmaker_handler"
        echo "from handlers.matchmaker_handler import matchmaker_handler" > main.py
        gcloud functions deploy matchmaker_handler \
          --gen2 \
          --runtime=${_RUNTIME} \
          --region=${_REGION} \
          --source=. \
          --entry-point=matchmaker_handler \
          --trigger-topic=${_PUBSUB_TOPIC} \
          --memory=256MB \
          --timeout=60s \
          --set-env-vars="PUBSUB_TOPIC_NAME=${_PUBSUB_TOPIC},PUBSUB_SUBSCRIPTION_NAME=${_PUBSUB_SUBSCRIPTION},FIREBASE_RTDB_URL=${_FIREBASE_RTDB_URL},GOOGLE_CLOUD_PROJECT=${PROJECT_ID}" \
          --set-secrets="FIREBASE_API_KEY=projects/${PROJECT_ID}/secrets/firebase-api-key:latest,GOOGLE_OAUTH_CLIENT_ID=projects/${PROJECT_ID}/secrets/google-oauth-client-id:latest"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _RUNTIME: python313
  _PUBSUB_TOPIC: ride-requests
  _PUBSUB_SUBSCRIPTION: matchmaking-sub
  _FIREBASE_RTDB_URL: 'https://chauffeur-38757-default-rtdb.firebaseio.com/'
